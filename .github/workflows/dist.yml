name: Build to dist branch
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build only, skip push to dist branch
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        arch:
          - msbuild: x64
            out: x64
          - msbuild: Win32
            out: Win32
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.arch.out }}
        run: msbuild LyricPlugin.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.arch.msbuild }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/${{ matrix.arch.out }} -Force
          Copy-Item "Bin\${{ matrix.arch.out }}\Release\plugins\LyricPlugin.dll" "dist/${{ matrix.arch.out }}/"
          Copy-Item "Bin\${{ matrix.arch.out }}\Release\plugins\LyricPlugin.pdb" "dist/${{ matrix.arch.out }}/"

      - name: Create README.md
        if: matrix.arch.msbuild == 'x64'
        shell: pwsh
        run: |
          $h = Get-Content -Raw src/compat/resource.h
          $maj = [regex]::Match($h, '#define\s+VER_MAJOR\s+(\d+)').Groups[1].Value
          $min = [regex]::Match($h, '#define\s+VER_MINOR\s+(\d+)').Groups[1].Value
          $pat = [regex]::Match($h, '#define\s+VER_PATCH\s+(\d+)').Groups[1].Value
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          $repo = "${{ github.repository }}"
          $owner = "${{ github.repository_owner }}"
          @"
# LyricPlugin

Version: v$maj.$min.$pat
Build: $now
Commit: $sha

## Files

- ~x64/LyricPlugin.dll~ / ~x64/LyricPlugin.pdb~ — 64-bit build
- ~Win32/LyricPlugin.dll~ / ~Win32/LyricPlugin.pdb~ — 32-bit build

## Installation

Copy the ~.dll~ and ~.pdb~ to TrafficMonitor's ~plugins/~ directory.

## Usage

Requires LX Music running with Web API enabled (default port ~23330~).

Configure via plugin options dialog:
- **Port** — LX Music Web API port
- **Font / Size / Scroll Speed** — lyric display settings
- **Width** — ~0~ for auto-width

## License

MIT © $owner

## Links

- Source: https://github.com/$repo
- Releases: https://github.com/$repo/releases
"@ -replace '~', [char]96 | Out-File -Encoding utf8 dist/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch.out }}
          path: dist/

  push:
    if: ${{ !inputs.dry-run }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*

      - name: Assemble dist
        run: |
          mkdir -p dist/x64 dist/Win32
          cp -r build-x64/* dist/
          cp -r build-Win32/* dist/

      - name: Force push to dist branch
        run: |
          cd dist
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "dist: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:dist
